# Same as vits14_reg4.yaml, but with the FFN of the public 2D DINOv2
# ViT-S/14 checkpoint, so that its transformer blocks can be loaded into this 3D
# model (see MODELS["vits14-reg4-2dinit"]). The public ViT-S/B/L checkpoints use plain MLP
# FFNs. ffn_layer: swiglufused would make the checkpoint unloadable.
student:
  arch: vit_small
  patch_size:
    - 14
    - 14
    - 4
  drop_path_rate: 0.1
  num_register_tokens: 4
  interpolate_antialias: true
  interpolate_offset: 0.0
  ffn_layer: mlp
  block_chunks: 0
