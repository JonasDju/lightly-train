# Standalone KneeNo classification evaluation of a finished 2D DINOv2 pretraining run -- config for
# cluster/eval_dinov2_kneeno.py (--config), i.e. `lightly-train eval_classification eval_config=...`. Exactly three
# top-level keys: checkpoint, image_size, eval. Env vars ($VAR, ${VAR}, leading ~) are expanded everywhere; an
# unset one is an error.
#
# ${PRETRAIN_JOB_ID} is the SLURM job ID of the pretraining run (pretrain-MI-vitb14-2d.yaml's data.out is named
# after it). Not ${SLURM_JOB_ID}: in the eval job that is the eval job's own ID. Submit with (RWTH's sbatch does not
# export a `PRETRAIN_JOB_ID=... sbatch` prefix to the job)
#     sbatch --export=ALL,PRETRAIN_JOB_ID=<id> cluster/submit_eval_dinov2_kneeno.sh
#
# Outputs, all inside the pretraining run's folder: TensorBoard test metrics (eval.logging.tensorboard_dir), per-label
# CSVs (eval.logging.per_label_dir), and in the parent of per_label_dir the final metrics (results.json) and this
# config with env vars expanded (params.yaml). The command refuses to start if any of them already exist.

checkpoint: /hpcwork/va105917/lightly/pretrain/${PRETRAIN_JOB_ID}.2d.vitb.224px/checkpoints/last.ckpt
# Must equal the pretraining run's transform.image_size: every slice is resized to it, and the checkpoint does not
# record it.
image_size:
- 224
- 224

# KneeNo classification evaluation -- see KneeNo/kneeno/evaluation/config.py for every key and its default.
# Identical to pretrain-MI-vitb14-2d.yaml's eval block except:
#   * data: test_sets [internal, external] (the heads are trained once and scored on both; the in-training eval
#     never tests on external), subset 1.0 (all internal "train" exams, not a subsample), data_root on the job's
#     node-local $TMP (where submit_eval_dinov2_kneeno.sh extracts both datasets; /dev/shm is for pretraining
#     only) and label_meta with the external dataset's paths too, 31 workers, abort_on_io_error true.
#   * logging.tensorboard_dir is set: there are no lightly-train loggers here to re-log the metrics, so KneeNo's
#     own SummaryWriter writes the test metrics.
#   * freq only selects the tasks: every task with a non-null value (> 0) runs once; the value itself is ignored.
#     Every task is listed explicitly, because a missing key keeps KneeNo's default frequency (deep merge).
#   * attentive_pool has a block of its own: the pretraining run never runs it, so it has none there.
eval:
  seed: 239
  encoder: target  # target (EMA teacher) | online (student)
  amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32. Heads still train in float32.
  cache_features: true  # linear / linear_pool / linear_slice_cls / attentive_slice_cls train on features extracted
                        # once instead of re-encoding every head epoch; k-NN always uses the shared pass.
                        # attentive_pool / attentive_slice_pool never cache.
  split:  # the internal global "train" split (pretrained on) is cut into train and val; the test sets are used whole
    val_fraction: 0.2  # heads are scored on val every head epoch (early stopping)
  training:
    early_stop_on: auroc  # val metric that picks each head's best epoch
    early_stop_patience: 5  # head epochs without a val improvement before stopping; 0 = never stop early
  verbose: true  # log each task's start and every head epoch's val metrics
  data:
    # internal: global "train" (the heads' train/val) + "val" (the "internal" test set); external: global "test"
    data_root: {internal: $TMP/kneeno_data/internal, external: $TMP/kneeno_data/external}
    label_meta:
      internal: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_labeled.json
      external: /hpcwork/p0021834/workspace_roman/jonas/metadata/external_labeled.json
    test_sets: [internal, external]  # heads are trained once and scored on both
    series_depth: 24  # slices per volume the encoder sees one by one; also the slice count of the slice tasks
    resample_mode: nearest
    num_workers: 31
    subset: 1.0  # seeded subsample of the internal "train" EXAMS (test sets always whole): float in (0, 1] = fraction, int > 1 = count, 1.0 = all
    abort_on_io_error: true  # a broken exam is retried (5 s apart) and then raises; never replaced by another exam
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: /hpcwork/va105917/lightly/pretrain/${PRETRAIN_JOB_ID}.2d.vitb.224px/eval/post-training/tb
    per_label_dir: /hpcwork/va105917/lightly/pretrain/${PRETRAIN_JOB_ID}.2d.vitb.224px/eval/post-training/eval_per_label
    tag_prefix: eval
  freq:
    knn: 1
    linear: 1
    linear_pool: 1
    attentive_pool: 1
    linear_slice_cls: 1
    attentive_slice_cls: 1
    attentive_slice_pool: 1
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: 0.07
    pooling: avg  # how the per-slice cls tokens are pooled into one per volume (avg | max)
    center: true  # subtract each sequence's mean feature before the per-sequence L2 normalisation
    batch_size: 32  # exams -> 128 volumes, i.e. 128 * series_depth slices per encoder forward
  linear:
    # The "non-pooling" linear task still pools: this 2D encoder has one cls token per slice, and this is how
    # they are pooled into the volume's cls token (avg | max). linear_slice_cls uses them unpooled.
    pooling: avg
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    max_epochs: 20
    batch_size: 32  # exams
    lr: 0.001
  linear_pool:
    pooling: avg
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    max_epochs: 20
    batch_size: 32  # exams
    lr: 0.001
  attentive_pool:
    depth: 1
    num_heads: 12
    max_epochs: 20
    batch_size: 16  # exams
    lr: 0.0005
    warmup_epochs: 5
    weight_decay: 0.001
  linear_slice_cls:  # linear layer on all 4 * series_depth slice cls tokens (each L2-normalised, concatenated)
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    max_epochs: 20
    batch_size: 32  # exams
    lr: 0.001
  attentive_slice_cls:  # attentive head over the 4 * series_depth slice cls tokens (sequence + slice embeddings)
    depth: 1
    num_heads: 12
    max_epochs: 20
    batch_size: 32  # exams
    lr: 0.0005
    warmup_epochs: 5
    weight_decay: 0.001
  attentive_slice_pool:  # attentive head over all patch tokens with sequence + slice embeddings
    depth: 1
    num_heads: 12
    max_epochs: 20
    batch_size: 8  # exams -> 32 volumes, 768 slices per encoder forward
    lr: 0.0005
    warmup_epochs: 5
    weight_decay: 0.001
