# 3D DINOv2 pretraining on the unlabeled KneeNo volumes -- run config for cluster/pretrain_dinov2_kneeno.py
# (--config), the only source of the run's settings. The script passes model and the data and train blocks' keys
# to lightly_train.pretrain directly and the other three blocks as method_args, transform_args and the KneeNo eval
# callback's config; lightly-train copies this file into data.out as params-pretrain.yaml
# (params-pretrain-1.yaml, ... on each resume). Env vars ($VAR, ${VAR}, leading ~) are expanded everywhere.
#
# method/transform list every DINOv2Args / DINOv2ViTTransformArgs field at its lightly-train default (except
# num_channels, fixed to 1 for grayscale MRI); a block, or a key within one, that is left out falls back to
# that default. Leave out the eval block to pretrain without evaluation.

# Required: any 3D dinov2/<name>, e.g. dinov2/vits14-notpretrained.
model: dinov2/vitb14-notpretrained

# Required block, every key required. series_depth/resample_mode must match eval.data's (checked at startup).
data:
  out: /hpcwork/va105917/lightly/pretrain/${SLURM_JOB_ID}.14p.24d.vitb.224px  # logs, checkpoints, exported model; rerunning resumes from it
  data_root: /dev/shm/kneeno_data/internal  # extracted by submit_pretrain_dinov2_kneeno.sh (KneeNo/data/prepare_data.py)
  data_meta: /hpcwork/p0021834/workspace_roman/jonas/BigKneeTar/metadata_unlabeled.json
  series_depth: 24  # > 0 resamples every volume to this many slices; <= 0 keeps native depth
  resample_mode: nearest

train:
  epochs: auto    # auto -> DINOv2's default of 125k steps, converted to epochs
  batch_size: 128  # GLOBAL batch size, split across all GPUs of all nodes (use 32x N_GPU)
  num_workers: auto  # auto -> cpus-per-task - 1, per rank
  precision: auto
  gradient_accumulation_steps: 1
  loader_args:
    pin_memory: true

method:
  lr_scale_method: sqrt
  reference_batch_size: 1024
  ibot_separate_head: false
  hidden_dim: 2048
  dino_bottleneck_dim: 256
  ibot_bottleneck_dim: 256
  output_dim: 65536
  batch_norm: false
  student_freeze_last_layer_steps: 1250
  student_freeze_backbone_steps: 0
  n_tokenization_only_steps: 0
  dino_loss_weight: 1.0
  ibot_loss_weight: 1.0
  koleo_loss_weight: 0.1
  ibotpp: null  # null = plain iBOT, "all" = iBOT++, "masked" = something in between
  center_method: softmax
  center_momentum: 0.9
  momentum_start: 0.992
  momentum_end: 1.0
  student_temp: 0.1
  teacher_temp_start: 0.04
  teacher_temp_end: 0.07
  teacher_temp_warmup_steps: 37500
  mask_ratio_min: 0.1
  mask_ratio_max: 0.5
  mask_probability: 0.5
  min_lr: 1.0e-06
  warmup_steps: 12500
  layerwise_decay: 0.9
  patch_embed_lr_multiplier: 0.2
  weight_decay_start: auto
  weight_decay_end: 0.4
  gradient_clip_val: 3.0
  compile_blocks: true
  compile_heads: false  # compile the projection heads and the iBOT loss, see DINOv2Args.compile_heads
  ibot_loss_chunk_size: null  # e.g. 4096: iBOT loss in token chunks with activation checkpointing (ibotpp: all)
  activation_memory_budget: null  # e.g. 0.5, for the compiled regions; needs compile_blocks or compile_heads

transform:
  image_size:
  - 224
  - 224
  - 16
  channel_drop: null
  num_channels: 1
  random_resize:
    min_scale: 0.32
    max_scale: 1.0
  # area/linear/nearest/cubic, or <in-plane>+<depth> (e.g. area+nearest: depth nearest picks whole slices).
  # resize_upscale_interpolation applies to enlarged axes only; null means resize_interpolation everywhere.
  resize_interpolation: area
  resize_upscale_interpolation: linear
  crop_foreground: null
  random_rotation: null
  normalize:
    mean:
    - 0.5
    std:
    - 0.5
  gaussian_blur:
    prob: 1.0
    sigma_range:
    - 0.4
    - 0.6
  histogram_shift:
    alpha: 0.25
    prob: 0.8
    num_control_points: 10
  adjust_contrast:
    prob: 0.8
    gamma:
    - 0.8
    - 1.2
  gaussian_sharpen: null
  gibbs_noise: null
  gaussian_noise: null
  global_view_1:
    gaussian_blur:
      prob: 0.1
      sigma_range:
      - 0.4
      - 0.6
    gaussian_sharpen: null
    gibbs_noise:
      prob: 0.2
      alpha:
      - 0.5
      - 0.7
  local_view:
    num_views: 8
    view_size:
    - 98
    - 98
    - 8
    random_resize:
      min_scale: 0.05
      max_scale: 0.32
    gaussian_blur:
      prob: 0.5
      sigma_range:
      - 0.4
      - 0.6
    gaussian_sharpen: null

# KneeNo classification evaluation, run on the frozen encoder every eval.freq.<task>
# epochs -- see KneeNo/kneeno/evaluation/config.py for every key and its default.
#
# Mirrors vjepa2/configs/train_2_1/vitb16/pretrain-MI-256px-24f.yaml's "eval:" block so
# the two pretraining runs are scored identically. Two deliberate differences:
#   * "linear" is ENABLED here. V-JEPA 2.1 has no cls token, so vjepa2 must disable it;
#     DINOv2 does have one (DINOv2Adapter.has_cls_token = True), so both "linear" and
#     "linear_pool" are available.
#   * logging.tensorboard_dir is null. KneeNo's own SummaryWriter is switched off and the
#     metrics dict returned by evaluate() is re-logged through lightly-train's loggers
#     instead (see src/lightly_train/_callbacks/kneeno_eval.py), so eval scalars land in the same
#     TensorBoard/JSONL run as the training curves.
eval:
  seed: 239
  encoder: target  # target (EMA teacher) | online (student)
  amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32. Heads still train in float32.
  cache_features: true  # linear / linear_pool train on embeddings extracted once per evaluation instead of
                        # re-encoding every head epoch; k-NN always uses the shared pass. attentive_pool never caches.
  split:
    test_fraction: 0.2
  data:
    data_root: /dev/shm/kneeno_data/internal
    label_meta: /hpcwork/p0021834/workspace_roman/jonas/BigKneeTar/metadata_labeled.json
    dataset_type: internal
    series_depth: 24  # match the pretraining series_depth -- no resampling distribution shift
    resample_mode: nearest
    num_workers: 16
    subset: 12500  # seeded subsample of the labeled EXAMS: float in (0, 1] = fraction, int > 1 = count, 1.0 = all
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: null  # lightly-train's own loggers handle this -- see the header above
    per_label_dir: /hpcwork/va105917/lightly/pretrain/${SLURM_JOB_ID}.14p.24d.vitb.224px/eval/internal/in-training/eval_per_label
    tag_prefix: eval
  freq:
    knn: 5
    linear: 5
    linear_pool: 5
    attentive_pool: null  # Takes too long (~2h on 12k exams) -> only run once training is finished
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: 0.07
    pooling: avg
    center: true  # subtract each sequence's mean feature before the per-sequence L2 normalisation
    batch_size: 32  # exams -> 128 volumes per encoder forward
  linear:
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    epochs: 20
    batch_size: 32  # exams
    lr: 0.001
  linear_pool:
    pooling: avg
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    epochs: 20
    batch_size: 32  # exams
    lr: 0.001
