# lightly-train only reads student.* and crops.global_crops_size from this file (DINOv2ViTPackage.get_model).
# Everything else here is ignored: set it via method_args, optim_args, transform_args, ... instead.
student:
  arch: vit_base
  patch_size: 14
  num_register_tokens: 1
  layerscale: 1.0
  interpolate_antialias: true
  interpolate_offset: 0.0
crops:
  global_crops_size: 448  # 32 * patch_size=14, matches TIPS pos_embed shape (1, 1025, 768)
  local_crops_size: 98
