# Same as vitl14_reg4.yaml, but with the FFN of the public 2D DINOv2
# ViT-L/14 checkpoint, so that its transformer blocks can be loaded into this 3D
# model (see MODELS["vitl14-reg4-2dinit"]). The public ViT-S/B/L checkpoints use plain MLP
# FFNs. ffn_layer: swiglufused would make the checkpoint unloadable.
dino:
  head_n_prototypes: 131072
  head_bottleneck_dim: 384
ibot:
  separate_head: true
  head_n_prototypes: 131072
train:
  batch_size_per_gpu: 32
  dataset_path: ImageNet22k
  centering: sinkhorn_knopp
student:
  arch: vit_large
  patch_size:
    - 14
    - 14
    - 4
  drop_path_rate: 0.4
  ffn_layer: mlp
  block_chunks: 0
  num_register_tokens: 4
  interpolate_antialias: true
  interpolate_offset: 0.0
teacher:
  momentum_teacher: 0.994
optim:
  epochs: 500
  weight_decay_end: 0.2
  base_lr: 2.0e-04  # learning rate for a batch size of 1024
  warmup_epochs: 80
  layerwise_decay: 1.0
crops:
  local_crops_size:
    - 98
    - 98
    - 8
