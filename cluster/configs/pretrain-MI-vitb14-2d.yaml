# Vanilla 2D DINOv2 pretraining on the JPEG slices of the unlabeled KneeNo dataset -- run config for
# cluster/pretrain_dinov2_kneeno.py (--config), the only source of the run's settings. The script passes model,
# data.out and the train block's keys to lightly_train.pretrain directly, the case folders it selects with
# data.data_root and data.data_meta as pretrain's data, and the other blocks as method_args, transform_args,
# callbacks and the KneeNo eval callback's config; lightly-train copies this file into data.out as
# params-pretrain.yaml (params-pretrain-1.yaml, ... on each resume). Env vars ($VAR, ${VAR}, leading ~) are
# expanded everywhere.
#
# train/method/transform list every key at its stock lightly-train default (method: DINOv2Args, transform:
# DINOv2ViTTransformArgs); a block, or a key within one, that is left out falls back to that default.
#
# The eval block below runs KneeNo's classification tasks through the 2D adapter
# (src/lightly_train/_data/kneeno_adapter.py), which encodes every slice of every volume separately. Leave out the
# eval block to pretrain without evaluation.

# Required: any dinov2/<name>, e.g. dinov2/vits14-notpretrained.
model: dinov2/vitb14-notpretrained

# Required block, all keys required.
data:
  out: /hpcwork/va105917/lightly/pretrain/${SLURM_JOB_ID}.2d.vitb.224px  # logs, checkpoints, exported model; rerunning resumes from it
  # Every internal exam, the eval's val exams included. Extracted by submit_pretrain_dinov2_kneeno.sh
  # (KneeNo/data/prepare_data.py).
  data_root: /dev/shm/kneeno_data/internal
  # Only the case folders of its global splits train + unlabeled are pretrained on (KneeNo's pretraining_cases);
  # lightly-train searches them recursively for images: every <case>/<series>/<NNN>.jpeg slice is one sample.
  data_meta: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_unlabeled.json

train:
  epochs: auto  # auto -> DINOv2's default of 125k steps, converted to epochs
  batch_size: 128  # GLOBAL batch size, split across all GPUs of all nodes
  gradient_accumulation_steps: 1
  num_workers: auto  # auto -> cpus-per-task - 1, per rank
  precision: auto
  float32_matmul_precision: auto
  seed: 0
  checkpoint: null
  optim: auto
  optim_args: null
  loader_args: null
  trainer_args: null
  model_args: null
  activation_checkpoint_args: null

method:
  lr_scale_method: sqrt
  reference_batch_size: 1024
  ibot_separate_head: false
  hidden_dim: 2048
  dino_bottleneck_dim: 256
  ibot_bottleneck_dim: 256
  output_dim: 65536
  batch_norm: false
  student_freeze_last_layer_steps: 1250
  student_freeze_backbone_steps: 0
  dino_loss_weight: 1.0
  ibot_loss_weight: 1.0
  koleo_loss_weight: 0.1
  center_method: softmax
  center_momentum: 0.9
  momentum_start: 0.992
  momentum_end: 1.0
  student_temp: 0.1
  teacher_temp_start: 0.04
  teacher_temp_end: 0.07
  teacher_temp_warmup_steps: 37500
  mask_ratio_min: 0.1
  mask_ratio_max: 0.5
  mask_probability: 0.5
  min_lr: 1.0e-06
  warmup_steps: 12500
  layerwise_decay: 0.9
  patch_embed_lr_multiplier: 0.2
  weight_decay_start: auto
  weight_decay_end: 0.4
  gradient_clip_val: 3.0

transform:
  image_size:
  - 224
  - 224
  channel_drop: null
  num_channels: auto  # auto -> 3: the grayscale JPEGs are loaded as RGB
  random_resize:
    min_scale: 0.32
    max_scale: 1.0
  random_flip:
    horizontal_prob: 0.5
    vertical_prob: 0.0
  random_rotation: null
  color_jitter:
    prob: 0.8
    strength: 0.5
    brightness: 0.8
    contrast: 0.8
    saturation: 0.4
    hue: 0.2
  random_gray_scale: 0.2
  normalize:  # ImageNet
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  gaussian_blur:
    prob: 1.0
    sigmas:
    - 0.1
    - 2.0
    blur_limit: 0
  solarize: null
  global_view_1:
    gaussian_blur:
      prob: 0.1
      sigmas:
      - 0.1
      - 2.0
      blur_limit: 0
    solarize:
      prob: 0.2
      threshold: 0.5
  local_view:
    num_views: 8
    view_size:
    - 98
    - 98
    random_resize:
      min_scale: 0.05
      max_scale: 0.32
    gaussian_blur:
      prob: 0.5
      sigmas:
      - 0.1
      - 2.0
      blur_limit: 0
  record_geometry: false

# lightly-train's own callbacks (CallbackArgs in src/lightly_train/_callbacks/callback_args.py), each a mapping
# over that callback's defaults or null to switch it off; a callback left out keeps its default. kneeno_eval is
# not allowed here: the eval block below configures it. Keep model_checkpoint's dirpath and save_last at their
# defaults, resuming needs <out>/checkpoints/last.ckpt. E.g. a checkpoint every 50 epochs, besides last.ckpt:
callbacks:
  model_checkpoint:
    every_n_epochs: 50
    save_top_k: -1  # the default 1 keeps only the newest periodic checkpoint

# KneeNo classification evaluation, run on the frozen encoder every eval.freq.<task>
# epochs -- see KneeNo/kneeno/evaluation/config.py for every key and its default.
#
# Mirrors vjepa2/configs/train_2_1/vitb16/pretrain-MI-256px-24f.yaml's "eval:" block so
# the two pretraining runs are scored identically. Three deliberate differences:
#   * "linear" is ENABLED here. V-JEPA 2.1 has no cls token, so vjepa2 must disable it;
#     DINOv2 does have one (DINOv2Adapter.has_cls_token = True), so both "linear" and
#     "linear_pool" are available.
#   * The slice tasks (linear_slice_cls, attentive_slice_cls, attentive_slice_pool) are
#     available, because this 2D encoder encodes every slice on its own
#     (DINOv2Adapter.has_slice_tokens = True). They use eval.data.series_depth as the slice count.
#   * logging.tensorboard_dir is null. KneeNo's own SummaryWriter is switched off and the
#     metrics dict returned by evaluate() is re-logged through lightly-train's loggers
#     instead (see src/lightly_train/_callbacks/kneeno_eval.py), so eval scalars land in the same
#     TensorBoard/JSONL run as the training curves.
eval:
  seed: 239
  encoder: target  # target (EMA teacher) | online (student)
  amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32. Heads still train in float32.
  cache_features: true  # linear / linear_pool / linear_slice_cls / attentive_slice_cls train on features extracted
                        # once per evaluation instead of re-encoding every head epoch; k-NN always uses the shared
                        # pass. attentive_pool / attentive_slice_pool never cache.
  extraction_batch_size: 32  # exams -> at most 128 volumes, i.e. 128 * series_depth slices, per encoder forward
  split:  # the internal global "train" split (pretrained on) is cut into train and val; the test sets are used whole
    val_fraction: 0.2  # heads are scored on val every head epoch (early stopping)
  training:
    early_stop_on: auroc  # val metric that picks each head's best epoch
    early_stop_patience: 5  # head epochs without a val improvement before stopping; 0 = never stop early
    loss: BCE
  verbose: true  # log each task's start and every head epoch's val metrics
  data:
    # internal: global "train" (the heads' train/val) + "val" (the "internal" test set, not pretrained on).
    data_root: {internal: /dev/shm/kneeno_data/internal}
    label_meta: {internal: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_labeled.json}
    test_sets: [internal]  # in-training: never external (that is for the final numbers, not for picking checkpoints)
    series_depth: 24  # slices per volume the encoder sees one by one; also the slice count of the slice tasks
    resample_mode: nearest
    num_workers: 16
    prefetch_factor: 2  # batches each worker loads ahead; worker RAM in flight ~ num_workers * prefetch_factor batches
    subset: 12500  # seeded subsample of the internal "train" EXAMS (test sets always whole): float in (0, 1] = fraction, int > 1 = count, 1.0 = all
    abort_on_io_error: false  # a broken exam is replaced by a random other one of its part (a val exam may become a train exam) instead of killing the run
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: null  # lightly-train's own loggers handle this -- see the header above
    per_label_dir: /hpcwork/va105917/lightly/pretrain/${SLURM_JOB_ID}.2d.vitb.224px/eval/in-training/eval_per_label
    tag_prefix: eval
  freq:
    knn: 10
    linear: 10
    linear_pool: 10
    linear_slice_cls: 10  # trains on the cached slice cls tokens -> cheap
    attentive_slice_cls: 10  # trains on the cached slice cls tokens -> cheap
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: 0.07
    pooling: avg  # how the per-slice cls tokens are pooled into one per volume (avg | max)
    center: true  # subtract each sequence's mean feature before the per-sequence L2 normalisation
  linear:
    pooling: avg
    batchnorm: true
    max_epochs: 30
    batch_size: 64
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: 0.0015
    warmup_epochs: 5
    weight_decay: 0.0
  linear_pool:
    pooling: avg
    batchnorm: true
    max_epochs: 30
    batch_size: 64
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: 0.0015
    warmup_epochs: 5
    weight_decay: 0.0
  linear_slice_cls:
    batchnorm: true
    max_epochs: 30
    batch_size: 64
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: 0.0015
    warmup_epochs: 5
    weight_decay: 0.0
  attentive_slice_cls:
    q2l: false
    patch_sa_depth: 0
    qa_depth: 1
    num_heads: 16
    mlp_ratio: 4.0
    qkv_bias: true
    complete_block: true
    max_epochs: 30
    batch_size: 64
    grad_accum_steps: 1  # memory only: the head trains on micro-batches of batch_size / grad_accum_steps exams
    lr: 0.0015
    warmup_epochs: 5
    weight_decay: 0.001
