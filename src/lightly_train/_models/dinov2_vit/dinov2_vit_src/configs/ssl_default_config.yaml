# Defaults every DINOv2 model config (train/*.yaml, eval/*.yaml) is merged over. Only what builds the
# model is kept -- the keys DINOv2ViTPackage.get_model reads. Everything else from Meta's original
# DINOv2 training config (optim, teacher, dino, ibot, train, crop scales, local crops, ...) was never
# read by lightly-train and has been removed: those settings come from DINOv2Args /
# DINOv2AdamWViTArgs (_methods/dinov2/dinov2.py) and the transform args (the run config's
# method/transform blocks).
student:
  arch: vit_large
  patch_size:
    - 16
    - 16
    - 4
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  drop_path_uniform: true
  ffn_layer: "mlp"
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 0
  interpolate_antialias: false
  interpolate_offset: 0.1
crops:
  # Image size (H, W, D) the positional embedding is built for. Keep the depth in sync with
  # DINOTransformArgs.image_size (_methods/dino/dino_transform.py), see test_dinov2_vit_package.py.
  global_crops_size:
    - 224
    - 224
    - 16
