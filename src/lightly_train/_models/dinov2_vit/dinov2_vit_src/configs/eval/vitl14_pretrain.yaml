# lightly-train only reads student.* and crops.global_crops_size from this file (DINOv2ViTPackage.get_model).
# Everything else here is ignored: set it via method_args, optim_args, transform_args, ... instead.
student:
  arch: vit_large
  patch_size: 14
crops:
  global_crops_size: 518  # this is to set up the position embeddings properly
  local_crops_size: 98