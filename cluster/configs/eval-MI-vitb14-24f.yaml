# Standalone KneeNo classification evaluation of a finished 3D DINOv2 pretraining run -- config for
# cluster/eval_dinov2_kneeno.py (--config), i.e. `lightly-train eval_classification eval_config=...`. Top-level keys:
# weights, image_size, resize_interpolation, resize_upscale_interpolation, eval, and for an exported model also
# model, model_args (optional) and normalize; anything else is an error. Env vars ($VAR, ${VAR}, leading ~) are
# expanded everywhere; an unset one is an error.
#
# ${PRETRAIN_JOB_ID} is the SLURM job ID of the pretraining run (pretrain-MI-vitb14-24f.yaml's data.out is named
# after it). Not ${SLURM_JOB_ID}: in the eval job that is the eval job's own ID. Submit with (RWTH's sbatch does not
# export a `PRETRAIN_JOB_ID=... sbatch` prefix to the job)
#     sbatch --export=ALL,PRETRAIN_JOB_ID=<id> cluster/submit_eval_dinov2_kneeno.sh
#
# Outputs, all inside the pretraining run's folder: TensorBoard test metrics (eval.logging.tensorboard_dir), per-label
# CSVs (eval.logging.per_label_dir), and in the parent of per_label_dir the final metrics (results.json) and this
# config with env vars expanded (params.yaml). The command refuses to start if any of them already exist.

# A LightlyTrain checkpoint or an exported model (the state dict of the bare ViT, e.g. <data.out>/exported_models/
# exported_last.pt); the command tells them apart by their content.
weights: /hpcwork/va105917/lightly/pretrain/${PRETRAIN_JOB_ID}.14p.24d.vitb.224px/checkpoints/last.ckpt
# For an exported model only: it holds the weights only, so these describe the model. A checkpoint records them, and
# setting them with one is an error. Uncomment when weights points to an exported model; the values are
# pretrain-MI-vitb14-24f.yaml's (model, train.model_args (not set there), transform.normalize). An exported 3D model
# must have 1 input channel and normalize exactly one mean and one std value.
# model: dinov2/vitb14-notpretrained
# model_args: null
# normalize:
#   mean: [0.5]
#   std: [0.5]
# Must equal the pretraining run's transform.image_size / resize_interpolation / resize_upscale_interpolation:
# every volume is resized to image_size that way, and neither a checkpoint nor an exported model records them. A
# left-out resize key falls back to DINOv2ViTTransformArgs' default, with a warning.
image_size:
- 224
- 224
- 16
# area/linear/nearest/cubic, or <in-plane>+<depth> (e.g. area+nearest: depth nearest picks whole slices).
# resize_upscale_interpolation applies to enlarged axes only; null means resize_interpolation everywhere.
resize_interpolation: area
resize_upscale_interpolation: linear

# KneeNo classification evaluation -- see KneeNo/kneeno/evaluation/config.py for every key and its default.
# Identical to pretrain-MI-vitb14-24f.yaml's eval block except:
#   * data: test_sets [internal, external] (the heads are trained once and scored on both; the in-training eval
#     never tests on external), data_root on the job's
#     node-local $TMP (where submit_eval_dinov2_kneeno.sh extracts both datasets; /dev/shm is for pretraining
#     only) and label_meta with the external dataset's paths too, 31 workers.
#   * split.level / rep are ${SPLIT_LEVEL} / ${SPLIT_REP} instead of 0.25 / 0: one run per level and rep to report,
#     set by submit_eval_dinov2_kneeno.sh (default 1.0 / 0). Each run writes to its own level-<l>.rep-<r> folder.
#   * logging.tensorboard_dir is set: there are no lightly-train loggers here to re-log the metrics, so KneeNo's
#     own SummaryWriter writes the test metrics.
#   * the heads train longer (max_epochs 50, warmup_epochs 10 instead of 30 / 5): they are trained once here, not
#     every few pretraining epochs.
#   * freq only selects the tasks: every task with a non-null value (> 0) runs once; the value itself is ignored.
#     A task left out keeps KneeNo's default, null (off).
eval:
  seed: 239
  encoder: target  # target (EMA teacher) | online (student)
  encoder_amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32
  head_amp_dtype: null  # trained heads' forward under autocast (CUDA only): bfloat16 | null (float32)
  # torch.compile the frozen encoder's forward (one graph per batch shape): faster (Curia-B: 1.5x), the features
  # differ by float rounding only.
  compile_encoder: true
  # torch.compile the attentive heads' forward (one graph per micro-batch shape): faster, the results
  # differ by float rounding only.
  compile_attentive_heads: true
  cache_features: true  # linear / linear_pool train on embeddings extracted once instead of re-encoding every head
                        # epoch; k-NN always uses the shared pass. attentive_pool never caches.
  extraction_batch_size: 32  # exams -> at most 128 volumes per encoder forward (cache pass and re-encoding heads)
  split:  # train and val: one split of the split manifest (KneeNo data/make_split_manifest.py); the test sets are used whole
    manifest: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_split_manifest.json
    level: ${SPLIT_LEVEL}  # fraction of the internal global "train" split used for train + val; set by the submit script
    rep: ${SPLIT_REP}  # which of the level's stratified draws (0 .. n_seeds - 1); set by the submit script
  training:
    monitor_metric: auroc  # val metric that picks each head's best epoch and lr, and k-NN's temperature
    early_stop_patience_global: 0  # head epochs without a val improvement before stopping; 0 = never stop early; overridable per task
    loss: BCE
  verbose: true  # log each task's start and every head epoch's val metrics
  data:
    # internal: global "train" (the heads' train/val) + "val" (the "internal" test set); external: global "test"
    data_root: {internal: $TMP/kneeno_data/internal, external: $TMP/kneeno_data/external}
    label_meta:
      internal: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_labeled.json
      external: /hpcwork/p0021834/workspace_roman/jonas/metadata/external_labeled.json
    test_sets: [internal, external]  # heads are trained once and scored on both
    series_depth: 24  # match the pretraining series_depth -- no resampling distribution shift
    resample_mode: nearest
    num_workers: 31
    prefetch_factor: 2  # batches each worker loads ahead; worker RAM in flight ~ num_workers * prefetch_factor batches
    abort_on_io_error: true  # a broken exam is retried (5 s apart) and then raises; never replaced by another exam
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: /hpcwork/va105917/lightly/pretrain/${PRETRAIN_JOB_ID}.14p.24d.vitb.224px/eval/post-training/level-${SPLIT_LEVEL}.rep-${SPLIT_REP}/tb
    per_label_dir: /hpcwork/va105917/lightly/pretrain/${PRETRAIN_JOB_ID}.14p.24d.vitb.224px/eval/post-training/level-${SPLIT_LEVEL}.rep-${SPLIT_REP}/eval_per_label
    tag_prefix: eval
  freq:
    knn: 1
    linear: 1
    linear_pool: 1
    attentive_pool: 1
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: [0.01, 0.02, 0.05, 0.07, 0.1, 0.2, 0.5, 1.0]  # swept: each k uses its best val temperature
    pooling: avg
    center: true  # subtract each sequence's mean feature before the per-sequence L2 normalisation
  linear:
    pooling: avg
    batchnorm: true
    max_epochs: 50
    batch_size: 64
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02]  # swept: the best on val is tested
    warmup_epochs: 10
    weight_decay: 0.0
  linear_pool:
    pooling: avg
    batchnorm: true
    max_epochs: 50
    batch_size: 64
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02]  # swept: the best on val is tested
    warmup_epochs: 10
    weight_decay: 0.0
  attentive_pool:
    q2l: false
    encoder_layers: 0
    decoder_layers: 1
    num_heads: 16
    mlp_ratio: 4.0
    qkv_bias: true
    complete_block: true
    max_epochs: 15
    early_stop_patience: 5  # overrides training.early_stop_patience_global (re-encoding head, no feature cache)
    batch_size: 64
    grad_accum_steps: 4  # memory only: the head trains on micro-batches of batch_size / grad_accum_steps = 16 exams
    lr: 0.0005
    warmup_epochs: 3
    weight_decay: 0.001