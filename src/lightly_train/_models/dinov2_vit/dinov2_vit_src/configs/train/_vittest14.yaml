# lightly-train reads student.* (except embed_dim/depth/num_heads/mlp_ratio, which the _vit_test builder
# hardcodes) and crops.global_crops_size; everything else goes via method_args, transform_args, ...
student:
  arch: _vit_test
  patch_size:
    - 14
    - 14
    - 4
  embed_dim: 8
  depth: 3
  num_heads: 2
  mlp_ratio: 1
